[project]
name = "done-together"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=5.2,<5.3",
    "django-allauth>=65.21.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]
